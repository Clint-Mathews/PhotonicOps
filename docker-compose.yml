
services:
  prometheus:
    image: prom/prometheus:latest
    platform: linux/arm64
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # Bind-mount the scrape config so Prometheus knows what to target.
      # Edit config/prometheus/prometheus.yml to add or modify scrape jobs.
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Named volume for TSDB persistence across docker-compose restarts.
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Retain 15 days of metrics locally. Adjust for edge disk constraints.
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    platform: linux/arm64
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  postgres:
    image: postgres:15
    platform: linux/arm64
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    platform: linux/arm64
    container_name: langfuse
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SALT=${SALT}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED}
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    platform: linux/arm64
    container_name: ollama-photonicops
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  prometheus_data:
