# PhotonicOps — Prometheus Scrape Configuration
#
# All targets are local Compose services. DSP and triage share one Python process.

global:
  # Default interval at which Prometheus scrapes all targets.
  scrape_interval: 15s
  # Timeout for a single scrape request. Must be <= scrape_interval.
  scrape_timeout: 10s
  # How frequently Prometheus evaluates alerting and recording rules.
  evaluation_interval: 15s
  # Labels added to every time series and alert produced by this server.
  external_labels:
    system: photonicops
    environment: local-edge

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
          phase: "0"

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana
          phase: "0"

  - job_name: ingestion-go
    static_configs:
      - targets: ["ingestion-go:2112"]
        labels:
          service: ingestion-go
          language: go
          phase: "1.5"

  - job_name: dsp-agent
    static_configs:
      - targets: ["dsp-agent-python:8001"]
        labels:
          service: dsp-agent-python
          language: python
          phase: "4B"
